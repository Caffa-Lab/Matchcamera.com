name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate product JSON
        run: |
          node scripts/build_product_index.mjs
          python -m json.tool public/data/products.json > /dev/null
          python -m json.tool public/data/product-index.json > /dev/null
      - name: Check required files
        run: test -f public/index.html && test -f public/builder/index.html && test -f public/database/index.html && test -f public/program/resize/index.html
      - name: Validate programs
        run: |
          node scripts/test_programs.mjs
          node scripts/test_equipment_match.mjs
          node scripts/test_equipment_preview.mjs
          node scripts/test_resize_crop_control.mjs
          node --check public/assets/js/metadata.js
          node scripts/test_metadata_captions.mjs
          node scripts/test_accessory_expansion.mjs
      - name: Validate catalog visibility and admin toggles
        run: node scripts/test_catalog_visibility.mjs
      - name: Validate fixed-lens cameras
        run: node scripts/test_fixed_lens_catalog.mjs
      - name: Validate price details
        run: node scripts/test_price_details.mjs
      - name: Validate estimate price context
        run: node scripts/test_estimate_price_context.mjs
      - name: Validate minimal usage events
        run: node scripts/test_usage_events.mjs
      - name: Validate product correction feedback
        run: node scripts/test_product_feedback.mjs
      - name: Validate body and lens manufacturer filters
        run: node scripts/test_catalog_filter_order.mjs
      - name: Validate AdSense scope and consent controls
        run: node scripts/test_adsense_integration.mjs
