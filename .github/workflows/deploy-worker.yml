name: Deploy Matchcamera Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: matchcamera-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate admin and homepage
        run: |
          node scripts/build_product_index.mjs
          node --check public/admin/admin.js
          node --check public/admin/catalog-review.js
          node --check public/assets/js/home.js
          node --check public/assets/js/builder.js
          node --check public/assets/js/accessories.js
          node --check public/assets/js/filename/app.js
          node --check public/assets/js/filename/renderer.js
          node --check public/assets/js/resize/app.js
          node --check public/assets/js/resize/image-utils.js
          node --check public/program/resize/workers/image-worker.js
          node --check worker/index.js
          node scripts/test_admin_worker.mjs
          node scripts/test_catalog_visibility.mjs
          node scripts/test_catalog_filter_order.mjs
          node scripts/test_price_details.mjs
          node scripts/test_remaining_catalog.mjs
          node scripts/test_support_compatibility.mjs
          node scripts/test_support_visibility.mjs
          node scripts/test_spec_refresh.mjs
          node scripts/test_quality_review.mjs
          node scripts/test_battery_compatibility.mjs
          node scripts/test_programs.mjs
          node scripts/test_accessory_expansion.mjs
          python3 scripts/check_homepage.py

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"
          command: deploy
