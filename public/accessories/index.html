<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>액세서리 | Matchcamera</title>
  <meta name="description" content="마운트 어댑터, 메모리 카드, 배터리, 플래시, 삼각대 등 카메라 액세서리를 확인합니다.">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/site-enhancements.css">
  <link rel="icon" href="/assets/images/matchcamera/symbol.png" type="image/png">
</head>
<body>
  <div data-header></div>
  <main class="simple-main">
    <section class="simple-hero">
      <div class="container">
        <h1>액세서리</h1>
        <p>기존 액세서리 항목을 유지하면서 마운트 어댑터 호환성까지 함께 제공합니다.</p>
      </div>
    </section>

    <section class="container">
      <div class="accessory-category-grid" aria-label="액세서리 종류">
        <button class="accessory-category active" type="button" data-accessory-category="adapter">
          <strong>마운트 어댑터</strong>
          <span>다른 마운트의 렌즈를 연결할 수 있는지 확인</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="memory">
          <strong>메모리 카드</strong>
          <span>SD · CFexpress · XQD 등 바디별 규격</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="battery">
          <strong>배터리</strong>
          <span>정품 배터리 및 바디별 배터리 규격</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="flash">
          <strong>플래시</strong>
          <span>핫슈 · TTL · 무선 플래시 호환성</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="tripod">
          <strong>삼각대 다리</strong>
          <span>허용 하중 · 높이 · 자체 무게</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="head"><strong>볼헤드</strong><span>허용 하중 · 볼 지름 · 클램프 규격</span></button>
        <button class="accessory-category" type="button" data-accessory-category="plate"><strong>플레이트</strong><span>범용·전용 플레이트와 Arca 규격</span></button>
      </div>

      <div class="accessory-panel" data-accessory-panel="adapter">
        <div class="toolbar" style="grid-template-columns:2fr 1fr 1fr 1fr">
          <input id="adapterSearch" class="control" placeholder="제품명 또는 마운트 검색">
          <select id="adapterBrand" class="control"></select>
          <select id="adapterFrom" class="control"></select>
          <select id="adapterTo" class="control"></select>
        </div>
        <p class="muted tiny"><b id="adapterCount">0</b>개 어댑터</p>
        <div id="adapterList" class="adapter-list"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="memory">
        <div class="toolbar"><input id="memorySearch" class="control grow" placeholder="카드명·규격·속도 검색"></div><p class="muted tiny"><b id="memoryCount">0</b>개 메모리 카드</p><div id="memoryList" class="accessory-data-grid"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="battery">
        <div class="toolbar battery-toolbar">
          <input id="batterySearch" class="control" placeholder="배터리명 또는 호환 바디 검색">
          <select id="batteryBrand" class="control"></select>
          <select id="batterySale" class="control">
            <option value="all">모든 판매 상태</option>
            <option value="예">현재 판매 확인</option>
            <option value="확인 필요">판매 상태 확인 필요</option>
          </select>
        </div>
        <p class="muted tiny"><b id="batteryCount">0</b>개 배터리</p>
        <div id="batteryList" class="battery-list"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="flash">
        <div class="toolbar"><input id="flashSearch" class="control grow" placeholder="플래시명·TTL 시스템 검색"></div><p class="muted tiny"><b id="flashCount">0</b>개 플래시</p><div id="flashList" class="accessory-data-grid"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="tripod">
        <p class="muted tiny"><b id="tripodCount">0</b>개 삼각대 다리</p><div id="tripodList" class="accessory-data-grid"></div>
      </div>
      <div class="accessory-panel hidden" data-accessory-panel="head"><p class="muted tiny"><b id="headCount">0</b>개 볼헤드</p><div id="headList" class="accessory-data-grid"></div></div>
      <div class="accessory-panel hidden" data-accessory-panel="plate"><p class="muted tiny"><b id="plateCount">0</b>개 플레이트</p><div id="plateList" class="accessory-data-grid"></div></div>
    </section>
  </main>
  <div data-footer></div>
  <script type="module" src="/assets/js/common.js?v=20260831-logo-filter-fix"></script>
  <script type="module" src="/assets/js/accessories.js?v=20260901-accessory-db"></script>
</body>
</html>
