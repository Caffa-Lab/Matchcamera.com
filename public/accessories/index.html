<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>액세서리 | Matchcamera</title>
  <meta name="description" content="마운트 어댑터, 메모리 카드, 배터리, 플래시, 삼각대 등 카메라 액세서리를 확인합니다.">
  <link rel="stylesheet" href="/assets/css/site.css?v=20260911-price-details">
  <link rel="stylesheet" href="/assets/css/site-enhancements.css?v=20260911-quality">
  <link rel="stylesheet" href="/assets/css/support.css?v=20260911">
  <link rel="icon" href="/assets/images/matchcamera/symbol.png" type="image/png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6581176496481636" crossorigin="anonymous"></script>
</head>
<body class="accessories-page">
  <div data-header></div>
  <main class="simple-main">
    <section class="simple-hero">
      <div class="container">
        <h1>액세서리</h1>
        <p>촬영 액세서리를 찾고, 삼각대·헤드·플레이트의 연결 규격을 확인하세요.</p>
      </div>
    </section>

    <section class="container">
      <div class="accessory-category-grid" aria-label="액세서리 종류">
        <button class="accessory-category active" type="button" data-accessory-category="adapter">
          <strong>마운트 어댑터</strong>
          <span>다른 마운트의 렌즈를 연결할 수 있는지 확인</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="memory">
          <strong>메모리 카드</strong>
          <span>CFA · CFB · SD UHS-II 이상</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="battery">
          <strong>배터리</strong>
          <span>정품 배터리 및 바디별 배터리 규격</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="flash">
          <strong>플래시</strong>
          <span>핫슈 · TTL · 무선 플래시 호환성</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="tripod">
          <strong>삼각대</strong>
          <span>다리 단품 · 헤드 포함 세트</span>
        </button>
        <button class="accessory-category" type="button" data-accessory-category="head"><strong>삼각대 헤드</strong><span>볼헤드 · 영상용 헤드 · 체결 규격</span></button>
        <button class="accessory-category" type="button" data-accessory-category="plate"><strong>플레이트</strong><span>범용·전용 플레이트와 Arca 규격</span></button>
      </div>

      <div class="accessory-panel" data-accessory-panel="adapter">
        <div class="toolbar adapter-toolbar">
          <input id="adapterSearch" class="control" placeholder="제품명 또는 마운트 검색">
          <select id="adapterBrand" class="control"></select>
          <select id="adapterFrom" class="control"></select>
          <select id="adapterTo" class="control"></select>
        </div>
        <p class="muted tiny"><b id="adapterCount">0</b>개 어댑터</p>
        <div id="adapterList" class="adapter-list"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="memory">
        <div class="toolbar"><input id="memorySearch" class="control grow" aria-label="메모리 카드 검색" placeholder="브랜드·카드명·규격 검색"><select id="memoryType" class="control" aria-label="카드 규격"><option value="all">모든 규격</option><option value="CFexpress Type A">CFA</option><option value="CFexpress Type B">CFB</option><option value="SD">SD UHS-II 이상</option></select><select id="memoryBrand" class="control" aria-label="메모리 카드 브랜드"></select></div><p class="muted tiny"><b id="memoryCount">0</b>개 메모리 카드</p><div id="memoryList" class="accessory-data-grid"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="battery">
        <div class="toolbar battery-toolbar">
          <input id="batterySearch" class="control" placeholder="배터리명 또는 호환 바디 검색">
          <select id="batteryBrand" class="control"></select>
          <select id="batterySale" class="control">
            <option value="all">모든 판매 상태</option>
            <option value="예">현재 판매 확인</option>
            <option value="확인 필요">판매 상태 확인 필요</option>
          </select>
        </div>
        <p class="muted tiny"><b id="batteryCount">0</b>개 배터리</p>
        <div id="batteryList" class="battery-list"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="flash">
        <div class="toolbar"><input id="flashSearch" class="control grow" placeholder="플래시명·TTL 시스템 검색"></div><p class="muted tiny"><b id="flashCount">0</b>개 플래시</p><div id="flashList" class="accessory-data-grid"></div>
      </div>

      <div class="accessory-panel hidden" data-accessory-panel="tripod">
        <div class="toolbar"><input id="tripodSearch" class="control" aria-label="삼각대 검색" placeholder="브랜드·제품명 검색"><select id="tripodBrand" class="control" aria-label="삼각대 브랜드"></select><select id="tripodKind" class="control" aria-label="삼각대 구성"><option value="all">모든 구성</option><option value="tripod-legs">다리 단품</option><option value="tripod-kit">헤드 포함 세트</option></select></div>
        <p class="muted tiny"><b id="tripodCount">0</b>개 삼각대 · 대표 모델부터 수록하며 확인된 사양만 표시합니다.</p><div id="tripodList" class="accessory-data-grid"></div>
      </div>
      <div class="accessory-panel hidden" data-accessory-panel="head"><div class="toolbar"><input id="headSearch" class="control" aria-label="헤드 검색" placeholder="브랜드·제품명·체결 규격 검색"><select id="headBrand" class="control" aria-label="헤드 브랜드"></select><select id="headType" class="control" aria-label="헤드 종류"><option value="all">모든 종류</option><option value="ball-head">볼헤드</option><option value="fluid-head">영상용 유체 헤드</option></select></div><p class="muted tiny"><b id="headCount">0</b>개 헤드 단품</p><div id="headList" class="accessory-data-grid"></div></div>
      <div class="accessory-panel hidden" data-accessory-panel="plate"><div class="toolbar"><input id="plateSearch" class="control grow" aria-label="플레이트 검색" placeholder="브랜드·모델·호환 바디 검색"><select id="plateBrand" class="control" aria-label="플레이트 브랜드"></select></div><p class="muted tiny"><b id="plateCount">0</b>개 플레이트</p><div id="plateList" class="accessory-data-grid"></div><button id="plateMore" class="control" type="button" hidden>플레이트 더 보기</button></div>
      <section id="supportChecker" class="accessory-panel hidden" aria-labelledby="supportTitle">
        <h2 id="supportTitle">삼각대·헤드 조합 확인</h2>
        <p>다른 브랜드도 체결 규격이 맞으면 연결할 수 있습니다. 다리↔헤드와 헤드↔플레이트를 각각 확인하세요.</p>
        <div class="toolbar"><label>삼각대<select id="checkTripod" class="control"></select></label><label>별도 헤드<select id="checkHead" class="control"></select></label><label>플레이트<select id="checkPlate" class="control"></select></label></div>
        <div id="supportResult" aria-live="polite"></div>
        <p class="muted tiny">허용 하중은 촬영 장비와 헤드 무게를 함께 고려해야 합니다. 영상용 헤드는 무게중심·카운터밸런스 조건도 확인하세요. <a href="/builder/">견적에서 장비와 함께 검사 →</a></p>
      </section>
    </section>
  </main>
  <div data-footer></div>
  <script type="module" src="/assets/js/common.js?v=20260831-logo-filter-fix"></script>
  <script type="module" src="/assets/js/accessories.js?v=20260911-support"></script>
</body>
</html>
