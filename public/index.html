<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의하기 | Matchcamera</title><meta name="description" content="Matchcamera에 문의 메일을 보냅니다."><link rel="stylesheet" href="/assets/css/site.css"><link rel="stylesheet" href="/assets/css/site-enhancements.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"></head><body><div data-header></div><main class="simple-main"><section class="simple-hero"><div class="container"><h1>문의하기</h1><p>입력한 내용을 기본 메일 앱에서 admin@matchcamera.com으로 보냅니다.</p></div></section><form id="contactForm" class="contact-shell"><div class="contact-grid"><div class="contact-field"><label for="contactName">이름</label><input id="contactName" required autocomplete="name"></div><div class="contact-field"><label for="contactEmail">이메일</label><input id="contactEmail" type="email" required autocomplete="email"></div><div class="contact-field"><label for="contactType">문의 유형</label><select id="contactType"><option>제품 정보 수정</option><option>호환성 문의</option><option>사이트 오류</option><option>제휴/광고</option><option>기타</option></select></div><div class="contact-field"><label for="contactSubject">제목</label><input id="contactSubject" required></div><div class="contact-field full"><label for="contactMessage">내용</label><textarea id="contactMessage" required></textarea></div></div><div class="contact-actions"><small>수신: admin@matchcamera.com · 입력 내용은 Matchcamera 서버에 저장하지 않습니다.</small><button class="primary-button" type="submit">메일 보내기</button></div></form></main><div data-footer></div><script type="module" src="/assets/js/common.js"></script><script type="module" src="/assets/js/contact.js"></script></body></html>
