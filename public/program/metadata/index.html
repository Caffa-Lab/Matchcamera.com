<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>사진 메타데이터 추출기 | Matchcamera</title>
  <meta name="description" content="사진의 카메라, 렌즈, ISO, 셔터스피드, 조리개 메타데이터를 브라우저에서 확인합니다.">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/site-enhancements.css">
  <link rel="stylesheet" href="/assets/css/metadata.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script defer src="https://unpkg.com/exifr@7.1.3/dist/full.umd.js"></script>
</head>
<body class="metadata-page">
  <div data-header></div>
  <main class="metadata-main">
    <section class="metadata-hero">
      <div class="container metadata-hero-inner">
        <div>
          <span class="metadata-eyebrow">MATCHCAMERA PROGRAM</span>
          <h1>사진 메타데이터 추출기</h1>
          <p>사진을 드래그하거나 선택하면 카메라·렌즈·ISO·셔터스피드·조리개를 바로 확인합니다.</p>
        </div>
        <div class="metadata-privacy"><span aria-hidden="true">✓</span> 브라우저에서만 처리 · 서버 업로드 없음</div>
      </div>
    </section>

    <section class="container metadata-workspace">
      <div id="dropzone" class="metadata-dropzone" role="button" tabindex="0" aria-controls="fileInput">
        <div class="metadata-drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
        </div>
        <strong>여기로 사진을 드롭하세요</strong>
        <span>JPG · PNG · HEIC · TIFF · ARW · CR2 · NEF 등 여러 파일을 한 번에 선택할 수 있습니다.</span>
        <label class="metadata-file-button">사진 선택<input id="fileInput" type="file" accept="image/*,.heic,.heif,.tif,.tiff,.arw,.cr2,.nef" multiple></label>
      </div>

      <div class="metadata-results-head">
        <div><h2>추출 결과</h2><span id="resultCount">0개</span></div>
        <div class="metadata-status-wrap"><span id="status" aria-live="polite">준비됨</span><button id="clearResults" type="button" hidden>결과 지우기</button></div>
      </div>
      <div id="list" class="metadata-grid"></div>
      <div id="emptyResults" class="metadata-empty">사진을 선택하면 이곳에 메타데이터가 표시됩니다.</div>
    </section>
  </main>
  <div data-footer></div>
  <script type="module" src="/assets/js/common.js"></script>
  <script type="module" src="/assets/js/metadata.js"></script>
</body>
</html>
