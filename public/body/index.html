<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>카메라 바디 찾기 — Matchcamera</title>
  <meta name="description" content="제조사, 마운트, 센서 포맷과 주요 사양으로 카메라 바디를 빠르게 찾습니다.">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/catalog.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="finder-page" data-catalog-type="body">
  <div data-header></div>
  <main class="finder-main">
    <section class="finder-hero">
      <div class="finder-tabs" aria-label="제품 종류">
        <a class="finder-tab active" href="/body/">바디</a>
        <a class="finder-tab" href="/lens/">렌즈</a>
      </div>

      <div class="filter-shell">
        <div id="filterRows" class="filter-rows"></div>
        <aside class="finder-guide">
          <strong>카메라 바디 찾기 가이드</strong>
          <p>원하는 조건을 눌러 후보를 좁혀보세요.<br>여러 조건을 함께 사용할 수 있습니다.</p>
          <a href="/builder/">바디부터 구성 시작 →</a>
        </aside>
      </div>

      <div class="finder-search-row">
        <div class="finder-search">
          <span aria-hidden="true">⌕</span>
          <input id="catalogSearch" type="search" placeholder="제품명, 모델 코드, 시리즈 검색" autocomplete="off">
          <button id="clearCatalogSearch" type="button">초기화</button>
        </div>
      </div>
    </section>

    <section class="finder-results">
      <div class="result-bar">
        <p>상품 · <strong id="catalogCount">0</strong>개</p>
        <div class="result-controls">
          <button class="sort-button active" data-sort="recommend" type="button">추천순</button>
          <button class="sort-button" data-sort="new" type="button">최신순</button>
          <button class="sort-button" data-sort="name" type="button">이름순</button>
          <select id="saleSelect" class="result-select" aria-label="판매 상태">
            <option value="all">전체 상태</option>
            <option value="current">현재 판매</option>
            <option value="discontinued">단종</option>
          </select>
        </div>
      </div>
      <div id="productCards" class="finder-grid" aria-live="polite"></div>
      <button id="loadMore" class="load-more hidden" type="button">더 보기</button>
    </section>
  </main>
  <div data-footer></div>
  <script type="module" src="/assets/js/common.js"></script>
  <script type="module" src="/assets/js/catalog.js"></script>
</body>
</html>
